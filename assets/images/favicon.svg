<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Blue Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="45%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0A1C52" />
    </linearGradient>

    <!-- Glass Tint Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1A3A" />
      <stop offset="100%" stop-color="#152E5E" />
    </linearGradient>

    <!-- Sparkle Glow Filter -->
    <filter id="sparkleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Squircle Base -->
  <rect x="18" y="18" width="476" height="476" rx="112" fill="url(#bgGrad)" />
  <!-- Inner Specular Rim -->
  <rect x="20" y="20" width="472" height="472" rx="110" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.22" />

  <!-- Ground Shadow & Speed Streamline -->
  <ellipse cx="256" cy="376" rx="205" ry="12" fill="#071126" opacity="0.45"/>
  <path d="M 45 380 Q 256 370 467 380" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>

  <!-- Main Car Body Silhouette (Sports Coupe) -->
  <path d="
    M 66 345
    L 105 345
    A 40 40 0 0 1 185 345
    L 335 345
    A 40 40 0 0 1 415 345
    L 440 345
    C 450 345 454 332 454 318
    C 454 298 444 286 428 280
    L 365 264
    C 356 260 348 252 342 242
    L 308 214
    C 298 206 282 202 266 202
    L 190 202
    C 174 202 160 210 148 224
    L 110 265
    L 80 274
    C 68 278 58 288 58 302
    L 58 324
    C 58 338 62 345 66 345
    Z"
    fill="#FFFFFF"
  />

  <!-- Dynamic Shoulder Line -->
  <path d="M 72 290 C 180 282 320 278 442 292" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Rocker Panel Accent -->
  <path d="M 190 338 L 330 338" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Windows / Greenhouse -->
  <!-- Front Windshield & Front Side Glass -->
  <path d="
    M 258 212
    L 292 218
    C 298 220 304 226 308 232
    L 334 258
    L 258 258
    Z"
    fill="url(#glassGrad)"
  />
  <!-- Windshield Reflection Streak -->
  <path d="M 292 222 L 322 254" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- Rear Side Glass & Fastback Quarter -->
  <path d="
    M 246 212
    L 194 212
    C 184 212 176 218 170 228
    L 130 258
    L 246 258
    Z"
    fill="url(#glassGrad)"
  />
  <!-- Rear Glass Reflection -->
  <path d="M 188 218 L 146 254" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.35"/>

  <!-- Headlight (Sleek Projector LED) -->
  <path d="M 432 284 L 452 290 C 453 296 450 300 444 300 L 428 294 Z" fill="#38BDF8" />

  <!-- Taillight (Crisp Red LED Bar) -->
  <path d="M 59 294 L 74 294 L 72 306 L 59 304 Z" fill="#EF4444" />

  <!-- Rear Wheel Assembly -->
  <circle cx="145" cy="345" r="33" fill="#0F172A" stroke="#1E293B" stroke-width="3"/>
  <circle cx="145" cy="345" r="22" fill="#E2E8F0" />
  <circle cx="145" cy="345" r="12" fill="#1E293B" />
  <circle cx="145" cy="345" r="5" fill="#3B82F6" />
  <circle cx="145" cy="345" r="18" fill="none" stroke="#0F172A" stroke-width="3" stroke-dasharray="6 5"/>

  <!-- Front Wheel Assembly -->
  <circle cx="375" cy="345" r="33" fill="#0F172A" stroke="#1E293B" stroke-width="3"/>
  <circle cx="375" cy="345" r="22" fill="#E2E8F0" />
  <circle cx="375" cy="345" r="12" fill="#1E293B" />
  <circle cx="375" cy="345" r="5" fill="#3B82F6" />
  <circle cx="375" cy="345" r="18" fill="none" stroke="#0F172A" stroke-width="3" stroke-dasharray="6 5"/>

  <!-- ✨ SIGNATURE "CARGLOSS" SPARKLES ✨ -->
  <!-- Main Signature Sparkle -->
  <g transform="translate(340, 150)" filter="url(#sparkleGlow)">
    <path d="M 0 -48 Q 0 0 48 0 Q 0 0 0 48 Q 0 0 -48 0 Q 0 0 0 -48 Z" fill="#93C5FD" opacity="0.8"/>
    <path d="M 0 -32 Q 0 0 32 0 Q 0 0 0 32 Q 0 0 -32 0 Q 0 0 0 -32 Z" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
  </g>

  <!-- Secondary Gloss Sparkle on Front Fender -->
  <g transform="translate(412, 236)" filter="url(#sparkleGlow)">
    <path d="M 0 -24 Q 0 0 24 0 Q 0 0 0 24 Q 0 0 -24 0 Q 0 0 0 -24 Z" fill="#BAE6FD" opacity="0.9"/>
    <path d="M 0 -15 Q 0 0 15 0 Q 0 0 0 15 Q 0 0 -15 0 Q 0 0 0 -15 Z" fill="#FFFFFF"/>
  </g>

  <!-- Tertiary Micro Sparkle at Rear Trunk/Spoiler -->
  <g transform="translate(94, 246)">
    <path d="M 0 -14 Q 0 0 14 0 Q 0 0 0 14 Q 0 0 -14 0 Q 0 0 0 -14 Z" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>
